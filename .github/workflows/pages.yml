name: Publish the live board

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:hosted
      - name: Point GitHub Pages at the live board
        run: |
          cat > .next-hosted/index.html << 'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0;url=https://extendsclass.com/api/json-storage/bin/ecafdcc">
            <title>Upcoming flights & tests</title>
            <link rel="canonical" href="https://extendsclass.com/api/json-storage/bin/ecafdcc">
          </head>
          <body>
            <p><a href="https://extendsclass.com/api/json-storage/bin/ecafdcc">Open the live board</a>.</p>
          </body>
          </html>
          EOF
      - name: Keep earlier page files available
        run: cp -an legacy-pages/. .next-hosted/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .next-hosted
      - id: deployment
        uses: actions/deploy-pages@v4
